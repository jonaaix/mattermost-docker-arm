services:
   mm:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: mattermost_app
      environment:
         DB_HOST: db
         DB_PORT: 5432
         MM_USERNAME: ${MM_DB_USER}
         MM_PASSWORD: ${MM_DB_PASSWORD}
         MM_DBNAME: ${MM_DB_NAME}
         MM_SQLSETTINGS_DRIVERNAME: postgres
         MM_SQLSETTINGS_DATASOURCE: postgres://${MM_DB_USER}:${MM_DB_PASSWORD}@db:5432/${MM_DB_NAME}?sslmode=disable&connect_timeout=10
         MM_FILESETTINGS_DRIVERNAME: local
         MM_SERVICESETTINGS_SITEURL: https://${MM_DOMAIN}
      labels:
            caddy_0: ${MM_DOMAIN}
            caddy_0.reverse_proxy: "{{upstreams 8065}}"
      volumes:
         - mm_data:/mattermost/data
         - mm_config:/mattermost/config
         - mm_plugins:/mattermost/plugins
         - mm_client:/mattermost/client
#      ports:
#         - "3000:8065"
      depends_on:
         - db
      restart: unless-stopped
      networks:
         - app
         - main-proxy

   db:
      image: postgres:16
      container_name: mattermost_db
      environment:
         POSTGRES_DB: ${MM_DB_NAME}
         POSTGRES_USER: ${MM_DB_USER}
         POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
      volumes:
         - db_volume:/var/lib/postgresql/data
      restart: unless-stopped
      networks:
         - app

   pgadmin:
      image: dpage/pgadmin4:latest
      container_name: mattermost_pgadmin
      environment:
         PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
         PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
         PGADMIN_CONFIG_SERVER_MODE: 'True'
      volumes:
         - pgadmin_volume:/var/lib/pgadmin
      restart: unless-stopped
      networks:
         - app
         - main-proxy
      labels:
         caddy_0: pgadmin.${MM_DOMAIN}
         caddy_0.reverse_proxy: "{{upstreams 80}}"

volumes:
   mm_data:
   mm_config:
   mm_plugins:
   mm_client:
   db_volume:
   pgadmin_volume:

networks:
   app:
      external: false
   main-proxy:
      external: true
